# QuickFIX Configuration File
# Pepperstone cTrader FIX Sessions

[DEFAULT]
ConnectionType=initiator
ReconnectInterval=30
FileStorePath=/home/ghost/fx-quant-research/state/fix_store
FileLogPath=/home/ghost/fx-quant-research/logs/fix
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
DataDictionary=/usr/share/quickfix/FIX44.xml
ValidateFieldsOutOfOrder=N
ValidateFieldsHaveValues=N
ValidateUserDefinedFields=N

# ============================================================================
# Session: Price Connection (Market Data)
# ============================================================================
[SESSION]
BeginString=FIX.4.4
SenderCompID=demo.pepperstone.5227001
SenderSubID=QUOTE
TargetCompID=cServer
SessionQualifier=PRICE
HeartBtInt=30
SocketConnectHost=demo-us-eqx-01.p.c-trader.com
SocketConnectPort=5211
SocketUseSSL=Y
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y

# ============================================================================
# Session: Trade Connection (Order Execution)
# ============================================================================
[SESSION]
BeginString=FIX.4.4
SenderCompID=demo.pepperstone.5227001
SenderSubID=TRADE
TargetCompID=cServer
SessionQualifier=TRADE
HeartBtInt=30
SocketConnectHost=demo-us-eqx-01.p.c-trader.com
SocketConnectPort=5212
SocketUseSSL=Y
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y
